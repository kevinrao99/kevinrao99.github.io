id: deuterostomia
name: Deuterostomia
short_description: "First opening in the blastula becomes the anus, and blastula is (generally) cleaved radially."
rank: superphylum
notes: |-
  First opening in the blastula becomes the anus, and blastula is cleaved radially.
children:
  - id: ambulacraria
    name: Ambulacraria
    short_description: "Invertebrate deuterostomes"
    rank: phylum
    notes: |-
      Standard deuterostome (radially cleaved triploblast) blastula develops into a dipleura larval form
      Echinoderms and hemichordates probably split 533 mya at the start of the cambrian
    children:
      - id: echinoderms
        name: Echinoderms
        short_description: "Sea stars, sea urchins, sea cucumbers, sea lilies"
        rank: phylum
        notes: |-
          Evolved from organisms with bilateral symmetry, as the larva are generally bilateral, these are organisms with (usually) 5 point radial symmetry as adults. The “left side” of the body grows “pentaradially” and the right side shrinks which is how they end up with radial symmetry.

          This is the largest phylum with NO TERRESTRIAL OR FRESHWATER members - mostly benthic.
          Most can reproduce asexually and regenerate organs and limbs.
          They have a mesodermal skeleton of plates of calcite. ossified dermal endoskeletons contributes to a lot of limestone formations and helps a lot with geology
          Their vascular system is based entirely on water.
      - id: hemichordates
        name: Hemichordates
        short_description: "Main member is the acorn worm"
        rank: phylum
        notes: |-
          have hollow dorsal nerve chord
  - id: chordata
    name: Chordata
    short_description: "\"During some period of their life cycle, chordates possess a notochord, a dorsal nerve cord, pharyngeal slits, and a post-anal tail: these four anatomical features define this phylum.\""
    rank: phylum
    notes: |-
      A fifth trait is sometimes added - having an endostyle or thyroid (endostyle is the simple old one, thyroid in vertebrates)
      This dorsal hollow nerve cord is the main component of the central nevous system.
    children:
      - id: cephalochordata
        name: Cephalochordata
        short_description: "Lancelets"
        rank: subphylum
        notes: |-
          gills are for feeding only and not respiration
      - id: olfactores
        name: Olfactores
        short_description: "Pharynx develops to include sensory and respiratory functions"
        rank: clade
        notes: |-
          olfactory system becomes nostrils in vertebrates
        children:
          - id: tunicates
            name: Tunicates
            short_description: "Somewhat random chordates, marine filter feeders"
            rank: subphylum
            notes: |-
              Formerly called Urochordates. Some are solitary, some replicate by budding and form colonies, most are sessile as adults, all are siphon/filter feeders.

              <mark class="highlight-green">Earliest probable tunicate appeared at the beginning of the Cambrian</mark>
          - id: vertebrates
            name: Vertebrates
            short_description: "Possess a vertebral column - a stiffer structure with jointed segments (vertebra) that replaces the notochord. Unique to vertebrates are neural crest cells and neural cephalization."
            rank: subphylum
            notes: |-
              <mark class="highlight-green">One of the earliest known vertebrates is the Haikouichtys, which appeared 525 mya during the Cambrian Explosion.</mark>

              (the hierarchy gets a bit messy here; basically it's jawed vs non jawed animals)
            children:
              - id: agnatha
                name: Agnatha
                short_description: "Lampreys and Myxini (hagfish)"
                rank: superclass
                notes: |-
                  Ectothermic. The digestive track is long and relatively homogeneous; no distinctive gut.

                  Haikouichthys, the earliest known vertebrate, falls in this category.

                  Many extinct species
              - id: gnathostomata
                name: Gnathostomata
                short_description: "Jawed vertebrates"
                rank: superclass
                notes: |-
                  living representatives have a semicircular ear canal, myelin sheaths on neurons, and paired appendages.

                  Jaws are believed to be derived from specialized gill arches which were adapted to push water into the mouth for gas exchange; over time, this resulted in the ability to bite.

                  <mark class="highlight-green">Jawed fishes first appeared in Ordovician</mark>
                children:
                  - id: placodermi
                    name: Placodermi
                    short_description: "Armored fishes"
                    rank: class
                    extinct: true
                    notes: |-
                      Some placoderms have been observed with three pairs of paired appendages, which has not been seen in any other vertebrate group. They also developed the first pelvic fins (precursors to legs in tetrapods) and true teeth consisting of pulp, bone, and dentine.

                      Some placoderms gave live birth; one fossil fossilized a mother in the process of giving birth with the umbilical cord intact. This pushed back the date of viviparity by 200 my.

                      <mark class="highlight-green">Earliest fossils found in China and are from the Silurian.</mark>
                  - id: eugnathostomata
                    name: Eugnathostomata
                    short_description: "everything else"
                    rank: superclass
                    children:
                      - id: acanthodians
                        name: Acanthodians
                        short_description: "Commonly called spiny sharks, paraphyletic group including the lineages leading to the extant Chondrichthyes"
                        rank: class
                        extinct: true
                        notes: |-
                          Contain many features shared between bony and cartilaginous fishes.
                          mostly marine, some freshwater acanthodians appeared in Devonian
                      - id: chondrichthyes
                        name: Chondrichthyes
                        short_description: "Cartilaginous fish"
                        rank: class
                        notes: |-
                          "A 419-million-year-old fossil of a placoderm named Entelognathus had a bony skeleton and anatomical details associated with cartilaginous and bony fish, <mark>demonstrating that the absence of a bony skeleton in Chondrichthyes is a derived trait.</mark>"

                          notochord replaced by a vertebral column except in holocephali
                          do not have bone marrow and instead RBC are produced in the spleen

                          Almost all have rough skin with dermal teeth. All use internal fertilization, but some lay eggs and some give live birth.
                        children:
                          - id: elasmobranchii
                            name: Elasmobranchii
                            short_description: "Sharks, rays, skates, sawfish"
                            notes: |-
                              <mark class="highlight-green">Earliest elasmobranch fossils are from the Devonian.</mark>

                              They don't have a swim bladder and instead use very oily livers to control buoyancy. Their eyes have tapetum lucidum.
                          - id: holocephali
                            name: Holocephali
                            short_description: "Only surviving members are chimaeras"
                            notes: |-
                              Includes the Australian ghostshark, <mark>which we believe to be the slowest evolving vertebrate.</mark> Unlike most cartilaginous fish, the notochord is not replaced by a vertebral column.
                      - id: osteichthyes
                        name: Osteichthyes
                        short_description: "Bony vertebrates"
                        rank: class
                        notes: |-
                          Early bony fish had simple lungs that in many cases later evolved into swim bladders (in other cases they became lungs for terrestrial vertebrates).
                        children:
                          - id: actinopterygii
                            name: Actinopterygii
                            short_description: "Ray-finned fish"
                            rank: class
                            notes: |-
                              fins are webs of skin supported by bony spines instead of fleshy limbs. Almost all species have separate sexes and external fertilization.
                            children:
                              - id: cladista
                                name: Cladista
                                short_description: "Only contains bichirs out of many extinct representatives"
                                notes: |-
                                  distinct traits are dorsal fins with independent rays and "a posteriorly elongated parasphenoid"
                              - id: actinopteri
                                name: Actinopteri
                                short_description: "Sister clade to Cladista where lungs evolve into a swim bladder"
                                children:
                                  - id: chondrostei
                                    name: Chondrostei
                                    short_description: "Primarily cartilaginous fish that also show some ossification"
                                    notes: |-
                                      The cartilage-ness is believed to be derived instead of elementary; ancestors of these species developed bones just like other Osteichthyes.

                                      Have a heterocercal tail. No scales just like sharks and other Elasmobranchii.
                                    children:
                                      - id: acipenseridae
                                        name: Acipenseridae
                                        short_description: "Sturgeon, 27 species"
                                        notes: |-
                                          Have 5 rows of scutes instead of scales. Sturgeons are anadromous (live in the sea, migrate to freshwater to mate). Toothless benthic suction feeders. Sturgeon are sometimes seen leaping completely out of the water and splashing down which can be heard a mile away and it's unclear why they do this.
                                      - id: polyodontidae
                                        name: Polyodontidae
                                        short_description: "Paddlefish"
                                  - id: neopterygii
                                    name: Neopterygii
                                    short_description: "Ray-finned subclass"
                                    children:
                                      - id: holostei
                                        name: Holostei
                                        short_description: "Gars and bowfins"
                                        notes: |-
                                          fishes are freshwater

                                          Bowfins have a heterocercal tail.
                                      - ref: teleostei
                          - id: sarcopterygii
                            name: Sarcopterygii
                            short_description: "Lobe-finned fish"
                            rank: class
                            notes: |-
                              All have teeth covered in true enamel, pectoral, and pelvic fins.

                              <mark class="highlight-green">This divergence of lobe finned fish from ray finned fish happened during the Devonian, approx 450 mya</mark>
                            children:
                              - id: onychondontida
                                name: Onychondontida
                                short_description: "Early diverging coelocanths"
                                rank: order
                                extinct: true
                              - id: actinistia
                                name: Actinistia
                                short_description: "Coelacanth"
                                rank: order
                                notes: |-
                                  Oldest known living lineage of Sarcopterygii, with the <mark class="highlight-green">oldest known fossils being 410 mya</mark>. Reach maturity at 55 years old, live to about 100 years old, gestate their young for 5 years. They retain an oil filled notochord instead of the standard vertebral column. They have a fatty vestigial lung which is homologous to other fish's swim bladder and one kidney which is two fused together.
                              - id: dipnomorpha
                                name: Dipnomorpha
                                short_description: "lungfish clade"
                                rank: infraclass
                                children:
                                  - id: porolepiformes
                                    name: Porolepiformes
                                    short_description: "prehistoric lobe-finned fish from the Devonian"
                                    rank: order
                                    extinct: true
                                  - id: dipnoi
                                    name: Dipnoi
                                    short_description: "Lungfish"
                                    rank: subclass
                                    notes: |-
                                      Have a complex and specialized lung system, and in most species the gills are too atrophied to function on their own.
                              - id: tetropodomorpha
                                name: Tetropodomorpha
                                short_description: "Tetrapods and extinct closest relatives"
                                rank: infraclass
                                children:
                                  - id: tetrapods
                                    name: Tetrapods
                                    short_description: "tetrapods"
                                    rank: order
                                    notes: |-
                                      Classification gets messy and largely hypothesis based here; the important features are stem tetrapods, amphibians, and amniotes, so that is how we present them here.

                                      <mark class="highlight-green">First tetrapods appeared 375 mya during the Devonian</mark> and were aquatic. It's not known how they colonized the land, but the development of amniotic sacs was crucial and drove many amphibious tetrapods to extinction.

                                      A notable development in Tiktaalik is the absence of bones covering the gills, resulting in the appearance of a neck that is absent in other tetrapodomorphs.

                                      Terrestrial tetrapods had to adapt to retaining water and supporting their bodies against gravity, as they were no longer were aquatic. The tetrapod tongue is built form muscles that used to control gill openings.

                                      The development of respiration was probably influenced by the <mark>charcoal gap</mark>, a period of 20 million years when atmospheric oxygen was too low to sustain wildfires. Aquatic tetrapods had to develop air breathing abilities to deal with low oxygen water and probably used gills, lungs, breathing through skin, and breathing through the digestive tract.

                                      The early terrestrial tetrapods would've had to adapt their smell to the difference in density of chemicals in the air and water. The refractive index of air and water is also different so eyes had to change and eyelids emerged to keep eyes moist. All but some amphibians lost the lateral line system.
                                    children:
                                      - id: stem-tetrapods
                                        name: Stem Tetrapods
                                        short_description: "“Branch” families of tetrapods with no significant evolutionary diversity or impact"
                                      - id: lissamphibia
                                        name: Lissamphibia
                                        short_description: "Amphibians"
                                        notes: |-
                                          Traditionally excludes the early Paleozoic tetrapods. Shared traits: two types of skin glands (mucous and granular), green rods for vision, ability to elevate eyes.
                                      - id: amniota
                                        name: Amniota
                                        short_description: "Amniotes, including reptiles and mammals, which lay eggs on land or retain them in the mother"
                                        notes: |-
                                          Develop straight into a limbed form with a thick epithelium as opposed to a larval tadpole stage that develops with metamorphosis. Embryonic development involves the membrains amnion, chorion, allantois. The replacement of the amphibian gelatinous membrane with the sturdy fibrous shell allowed an increase in egg size and rate of gas exchange, permitting the embryo to become larger and more metabolically active and thus more advanced before birth.

                                          <mark>Endothermy in some mammals and reptiles is theorized to be a defense mechanism against fungi</mark>, which cannot survive high body temperatures. By comparison, insects and ectotherms tend to suffer from a lot of fungal infections.
                                        children:
                                          - ref: synapsida
                                          - ref: sauropsida