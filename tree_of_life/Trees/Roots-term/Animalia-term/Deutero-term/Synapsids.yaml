                                          - ref: carnivora
                                            name: Carnivora
                                            short_description: ""
                                            notes: |-
                                              Carnivorans
                                      - id: euungulata
                                        name: Euungulata
                                        short_description: ""
                                        notes: |-
                                          Ungulates - Hooved animals
                                        children:
