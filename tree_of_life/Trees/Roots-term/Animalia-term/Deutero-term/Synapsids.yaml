                                    short_description: ""
                                    notes: |-
                                      Bats
                                  - id: ferungulata
                                    name: Ferungulata
                                    short_description: ""
                                    notes: |-
                                      Ferae and Ungulates
                                    children:
                                      - id: ferae
                                        name: Ferae
                                        short_description: ""
                                        children:
