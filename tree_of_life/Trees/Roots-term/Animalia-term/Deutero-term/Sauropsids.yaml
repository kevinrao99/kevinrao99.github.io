id: sauropsida
name: Sauropsida
short_description: "Reptiles"
notes: |-
  Everything else; lizards, snakes, crocodiles. This term is broadly equivalent to “reptiles.”

  <mark class="highlight-green">Reptiles first appeared during the Carboniferous and the two main branches, archosaurs and lepidosaurs, diverged during the Permain.</mark>

  Of surviving reptiles, the non-bird ones are cold blooded and are thus restricted by a slower metabolism. In some larger reptiles like the leatherback turtle, a low surface area to volume ratio and muscular heat allows them to maintain a slightly higher temperature than their surroundings without being truly warm blooded. This is called gigantothermy.

  The low food requirement associated with cold bloodedness (a crocodile can go half a year without eating) allows reptiles to persist in areas where food expensive mammals cannot. Not clear though if cold bloodedness is a result of ecology.

  Lepidosaurs have epidermal scales while turtles and crocodiles have dermal scales or scutes.

  Digestion is usually slow but their digestive tracts are short because meat and insects are easier to digest than plants. All reptiles have a cloaca.

  Reptiles have good vision and color vision that also allows them to see UV. Most reptiles have a nictitating membrane.
children:
  - id: parareptilia
    name: Parareptilia
    short_description: "Extinct family of reptiles that emerged in the Carboniferous period and includes Mesosaurs (not the same as Mosasaurs)"
    extinct: true
    notes: |-
      The first reptiles to return to the water. Also includes first bipedal reptiles and first reptiles with advanced hearing. Only a few parareptiles survived into the Triassic period
  - id: eureptilia
    name: Eureptilia
    short_description: "“True” reptiles"
    notes: |-
      The diapsids are the only ones who made it out of the Permian period (right before Triassic, ending in the Permian-Triassic extinction which is thought to be the biggest extinction event). We thus skip to Diapsids.
    children:
      - id: diapsids
        name: Diapsids
        short_description: "Amniote tetrapods characterized with the development of two temporal fenestra (holes) on each side of the skull"
        notes: |-
          The holes seem to be simply to reduce the weight of the skull.
        children:
          - id: sauropterygia
            name: Sauropterygia
            short_description: "aquatic reptiles including Icthyopterygia and Plesiosauria"
            extinct: true
            notes: |-
              This clade of extinct aquatic reptiles is difficult to classify since we only have fossil evidence of them and there was likely lots of convergent evolution for aquatic traits in reptiles, but we know that they are diapsids and think that lepidosaurs and archosaurs are more closely related to each other than either are to Sauropterygia (though also maybe they're closer to archosaurs than lepidosaurs).

              This clade includes Icthyopterygia, the aquatic reptiles with fins, and Plesiosauria, the ones with long necks and fins. It might also include Placodonts, or ancient sea turtle like reptiles which are probably not actually related to turtles.
          - id: sauria
            name: Sauria
            short_description: "Most recent common ancestors of Archosaurs (crocodiles, dinos, etc) and Lepidosaurs (lizards, etc)"
            notes: |-
              Now we know that modern turtles belong here and not in parareptilia, which contained ancient turtles.
            children:
              - id: lepidosauromorpha
                name: Lepidosauromorpha
                short_description: "All reptiles closer related to lizards than archosaurs"
                notes: |-
                  Lepidosaurs have a three chambered heart (one ventricle) that allows oxygenated and deoxygenated blood to mix.

                  Many lepidosaurs have a third eye on their head called a parietal eye which can detect light and dark which is useful for alerting of other animals casting a shadow.
                children:
                  - id: rhynchocephalia
                    name: Rhynchocephalia
                    short_description: "Only living species is the tuatara"
                  - id: squamata
                    name: Squamata
                    short_description: "Roughly, lizards and snakes"
                    notes: |-
                      “In squamates, the lungs are ventilated almost exclusively by the axial musculature. This is also the same musculature that is used during locomotion. Because of this constraint, most squamates are forced to hold their breath during intense runs.”
              - id: archosauromorpha
                name: Archosauromorpha
                short_description: ""
                notes: |-
                  Also called Archelosauria
                children:
                  - id: archosauriformes
                    name: Archosauriformes
                    short_description: "Roughly corresponds to the old definition of archosauria. Members have an antorbital fenestra in the skull"
                    children:
                      - id: archosauria
                        name: Archosauria
                        short_description: "Antorbital and mandibular fenestra and theocodonts"
                        notes: |-
                          Clade of which birds and crocodiles are the only living representatives. <mark class="highlight-green">This group rapidly expanded and dominated terrestrial vertebrates after the Permian-Triassic extinction.</mark>

                          theocodonts - teeth set in sockets to keep them from getting ripped out (although this is not unique to archosaurs; in particular mammals have this too).

                          One possible expanation for why archosaurs dominated so quickly after the permian-triassic extinction is they were quick to get upright limbs and avoid <mark>Carrier's constraint</mark>, where sideways limbs tends to hinder one lung at all times when moving (lizards have to walk a bit and stop to breathe). Another explanation is that archosaurs have much more water efficient urine. Another explanation is that archosaurs' respiratory systems were more efficient and equipped to deal with a drop in oxygen levels.
                        children:
                          - id: pseudosuchia
                            name: Pseudosuchia
                            short_description: "Crocs and extinct relatives"
                            notes: |-
                              For respiration, crocodillians have a diaphragm analogous to the mammalian diaphragm.
                          - id: avemetatarsalia
                            name: Avemetatarsalia
                            short_description: "Known for the “advanced mesotarsal” ankle, which allows for much greater mobility while walking"
                            notes: |-
                              aka Ornithodira

                              Also known for feather-like fibrous structures in the skin. Complete lack of Osteoderms, unlike in crocodiles.
                            children:
                              - id: pterosauromorpha
                                name: Pterosauromorpha
                                short_description: "Pterosaurs"
                                extinct: true
                                notes: |-
                                  Evolved flight independently of birds
                              - ref: dinosauria
                                name: Dinosauria
                                short_description: "All dinosaurs and modern-day birds"
                                notes: |-
                                  <mark class="highlight-green">Became the dominant vertebrates after the Triassic-Jurassic extinction event.</mark> They were probably active and had a warm blooded metabolism. The <mark>synapomorphies</mark> of dinosaurs:

                                  Radius shorter than 80% of the humerus

                                  (Many more on the wikipedia page)

                                  Eoraptor, <mark class="highlight-green">a small bipedal predator dinosaur from mid Triassic 231 mya</mark>, is believed to be close to the common ancestor of all dinosaurs.

                                  Dinosaurs started out fairly homogeneous but <mark class="highlight-green">began to get strongly differentiated wrt landmass shifts as Pangaea broke up in the early Cretaceous.</mark>
                  - id: testudines
                    name: Testudines
                    short_description: "Turtles"
                    notes: |-
                      It's not actually clear how turtles breathe; the issue is that the hard shell prevents any sort of chest expansion and contraction.

                      Also it's still disputed exactly where turtles go on the phylogeny; in particular if they are sauria.
