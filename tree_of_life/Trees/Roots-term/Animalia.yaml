id: animalia
name: Animalia
short_description: "Consume oxygen, move, reproduce sexually, grow from a blastula."
rank: kingdom
children:
  - id: porifera
    name: Porifera
    short_description: "Sponges"
    rank: phylum
    notes: |-
      unspecialized cells - 2 thin layers with a mesohyl (formerly mesoglea, but unlike mesoglea there is a lot of cellular activity) matrix between, and unspecialized cells can differentiate and move around in the mesohyl
      no nervous system, just pump water through the body
  - id: eumetazoa
    name: Eumetazoa
    short_description: "Organisms with true tissues that separate into germ layers"
    rank: subkingdom
    notes: |-
      Unclear if even related to Porifera under the clade of Animalia, it's mostly the clade of everything more complex than a porifera
      various other hypotheses exist for what this clade should be
    children:
      - id: ctenophora
        name: Ctenophora
        short_description: "comb jellies"
        rank: phylum
        notes: |-
          Microscopic organisms in marine ecosystems with jellylike bodies who move with cilia - largest animals to do this
          have mesoglea, which is not the same as porifera mesohyl. mesoglea is structural, mesohyl is also where some cell activity happens
      - id: parahoxozoa
        name: Parahoxozoa
        short_description: "Proposed clade sister to Ctenophora"
        rank: clade
        notes: |-
          debated if this is appropriate
          also within Parahoxozoa, hotly debated if cnidarians + placozoa go together under non-bilaterans. 2023 Cell paper suggests it should be Placozoa and sister group Planulozoa that has cnidarians and bilatera
          here for the sake of not changing the existing setup, keeping non-bilaterans vs bilaterans
        children:
          - id: non-bilaterans
            name: Non-Bilaterans
            short_description: ""
            children:
              - id: cnidarians
                name: Cnidarians
                short_description: "Jellyfish, coral, sea anemone, characterized by cnidocytes which they use to catch prey"
                notes: |-
                  Bodies consist of jelly called mesoglea in between two (often 1 cell thick) epithelial layers.
                  Nematostella vectensis - sea anemone with bilateral symmetry but is a cnidarian. also has challenged diploblast-triploblast distinction, since it has 3 germ layers and suggests maybe triploblasty appeared before cnidarian and bilateran divergence
              - id: placozoa
                name: Placozoa
                short_description: "Super simple multicellular marine animal"
                notes: |-
                  basically blobs with cilia to move around
                  "simplest animalson earth" - no mouth, no back, no nerves (primitive analog of "peptidergic" cells that kind of work like nerves), 3 tissue layers
          - id: bilaterans-triploblasts
            name: Bilaterans / Triploblasts
            short_description: "have bilateral symmetry during embryonic development. Triploblast - 3 germ layers: endoderm, mesoderm, ectoderm"
            notes: |-
              only a few exceptions to triptoblasty so traditionally these are associated with each other even though bilateran and triptoblast are not technically linked. bilateral symmetry provides a concept of front and back, and triptoblasty provides a mesoderm and opportunities to develop internal musculature and connective tissue to support locomotion and internal organization around the bilateral body plan
              cephalization common
              Notably, echinoderms (sea stars) have embryonic bilateral symmetry and belong in this group despite apparent radial symmetry as adults
            children:
              - id: nephrozoa
                name: Nephrozoa
                short_description: "Proposed major clade of most bilaterans"
                rank: clade
                notes: |-
                  It's unclear if protostomes or deuterostomes are ancestral because there are protostomes with deuterostomy (blastopore becomes anus). There are less examples of deuterostomes with mouth first development.
                  The split likely happened before the Cambrian, over 540 mya
                children:
                  - ref: protostomia
                  - ref: deuterostomia
              - id: proarticulata
                name: Proarticulata
                short_description: "extinct nearly-bilateral animals from Cambrian until late Devonian"
                rank: phylum
                extinct: true
              - id: xenacoleomorpha
                name: Xenacoleomorpha
                short_description: "Small phylum of bilateral nonprotostomes and nondeuterostomes"
                rank: phylum
                notes: |-
                  there's a new hypothesis that this is actually a sister to Ambulacraria, and Deuterostomes are paraphyletic instead of monophyletic. It's unclear if Xenacoleomorpha are Deuterostomes - they only have 1 opening so it's not clear if the blastopore forms a mouth or anus. Also different xenacoleomorphs have different blastula cleavage
                  I'm keeping it here though because I like the protostome-deuterostome clean separation of the nephrozoans
                children:
                  - id: xenoturbellida
                    name: Xenoturbellida
                    short_description: "A few benthic marine worms with a single mouth leading to a gastric cavity with no anus"
                  - id: acoleomorpha
                    name: Acoleomorpha
                    short_description: "Almost all marine, resemble simple flatworms"
                    notes: |-
                      no body cavity or anus.
                    children:
                      - id: acolea
                        name: Acolea
                        short_description: "microscopic bilateral worms"
                      - id: nemertodermatida
                        name: Nemertodermatida
                        short_description: "18 species of millimeter-sized worms"
