<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple 9-Char Wordle</title>
  <style>
    :root{
      --box: #e5e7eb;        /* gray-200 */
      --text: #111827;       /* gray-900 */
      --green: #22c55e;      /* emerald-500 */
      --yellow: #eab308;     /* amber-500 */
      --red: #ef4444;        /* red-500 */
      --focus: #3b82f6;      /* blue-500 */
      --bg: #f8fafc;         /* slate-50 */
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: var(--bg);
      color: var(--text);
    }
    .container{
      max-width: 680px;
      margin: 6rem auto;
      padding: 1rem;
      text-align: center;
    }
    h1{ font-size: 1.5rem; margin-bottom: 1rem; }
    .row{
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: .5rem;
      justify-items: center;
      margin: 1rem auto 0 auto;
      width: min(540px, 92vw);
    }
    .cell{
      width: 56px; height: 56px;
      display: grid; place-items: center;
      border: 2px solid var(--box);
      border-radius: .5rem;
      font-weight: 800; font-size: 1.5rem;
      background: white;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      user-select: none;
    }
    .cell input{
      width: 100%; height: 100%;
      text-transform: uppercase;
      text-align: center;
      font: inherit; font-weight: 800; letter-spacing: .02em;
      border: none; outline: none; background: transparent; color: var(--text);
    }
    .cell:has(input:focus){ border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in oklab, var(--focus) 20%, transparent); }
    .state-green{ background: var(--green); color: white; border-color: var(--green); }
    .state-yellow{ background: var(--yellow); color: #1f2937; border-color: var(--yellow); }
    .state-red{ background: var(--red); color: white; border-color: var(--red); }

    .actions{ margin-top: 1rem; display: flex; gap: .5rem; justify-content: center; }
    button{
      border: none; padding: .6rem 1rem; border-radius: .6rem; font-weight: 700; cursor: pointer;
      background: #111827; color: white; transition: transform 80ms ease; 
    }
    button:hover{ transform: translateY(-1px); }
    button.secondary{ background: #6b7280; }

    .message{ margin-top: 1rem; font-weight: 700; min-height: 1.5rem; }
    .success{ color: var(--green); }
    .error{ color: var(--red); }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Simple 9-Character Wordle</h1>
    <p>Type any A–Z or 0–9 (always capitalized). When all 9 boxes are filled, they’ll color according to Wordle rules.</p>

    <div class="row" id="row">
      <!-- 9 single-character inputs -->
    </div>

    <div class="actions">
      <button id="checkBtn" title="Check guess (only works when 9 filled)">Check</button>
      <button id="clearBtn" class="secondary" title="Clear the board">Clear</button>
      <button id="revealBtn" class="secondary" title="Reveal the answer">Reveal</button>
    </div>

    <div id="msg" class="message" role="status" aria-live="polite"></div>
    <div class="sr-only" id="srHint">Allowed characters are A–Z and 0–9. Letters will be auto-capitalized.</div>
  </div>

  <script>
    // === Configuration ===
    // Hardcoded 9-character answer. You can change this to any A–Z/0–9 string of length 9.
    const ANSWER = "WORDLE123"; // length must be 9
    const SUCCESS_TEXT = "Nice! You cracked it!"; // Custom success text to show on full green

    // === Setup ===
    const row = document.getElementById('row');
    const msg = document.getElementById('msg');
    const checkBtn = document.getElementById('checkBtn');
    const clearBtn = document.getElementById('clearBtn');
    const revealBtn = document.getElementById('revealBtn');

    const LEN = 9;
    const ALLOWED = /^[A-Z0-9]$/;

    /** Create 9 cells each with an input */
    const inputs = Array.from({ length: LEN }, (_, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const input = document.createElement('input');
      input.setAttribute('inputmode', 'latin');
      input.setAttribute('maxlength', '1');
      input.setAttribute('aria-label', `Character ${i+1} of ${LEN}`);
      input.addEventListener('input', onType);
      input.addEventListener('keydown', onKey);
      cell.appendChild(input);
      row.appendChild(cell);
      return input;
    });

    inputs[0].focus();

    // === Handlers ===
    function onType(e){
      const input = e.target;
      const v = (input.value || '').toUpperCase();
      if(!v){ return; }
      // Keep only a single allowed character
      const ch = v.slice(-1);
      if(!ALLOWED.test(ch)){
        input.value = '';
        announce("Only A–Z and 0–9 allowed");
        return;
      }
      input.value = ch; // enforce uppercase

      // Move to next empty input
      const idx = inputs.indexOf(input);
      if(idx < LEN-1){
        inputs[idx+1].focus();
      }
      // Auto-evaluate if filled
      if(isFilled()) evaluate();
    }

    function onKey(e){
      const input = e.target;
      const idx = inputs.indexOf(input);
      if(e.key === 'Backspace'){
        if(input.value){
          input.value = '';
          clearStates(idx);
        } else if(idx > 0){
          inputs[idx-1].focus();
          inputs[idx-1].value = '';
          clearStates(idx-1);
        }
        e.preventDefault();
        msg.textContent = '';
      } else if(e.key === 'ArrowLeft' && idx > 0){
        inputs[idx-1].focus();
        e.preventDefault();
      } else if(e.key === 'ArrowRight' && idx < LEN-1){
        inputs[idx+1].focus();
        e.preventDefault();
      } else if(e.key === 'Enter'){
        if(isFilled()) evaluate();
      }
    }

    checkBtn.addEventListener('click', () => { if(isFilled()) evaluate(); else announce('Fill all 9 boxes first.'); });
    clearBtn.addEventListener('click', clearAll);
    revealBtn.addEventListener('click', () => {
      const ans = ANSWER.toUpperCase();
      for(let i=0;i<LEN;i++){
        inputs[i].value = ans[i];
      }
      evaluate();
    });

    // === Helpers ===
    function isFilled(){
      return inputs.every(inp => inp.value && ALLOWED.test(inp.value.toUpperCase()));
    }

    function clearStates(startIndex=0){
      const cells = row.children;
      for(let i=startIndex;i<LEN;i++){
        cells[i].classList.remove('state-green','state-yellow','state-red');
      }
    }

    function clearAll(){
      inputs.forEach(i => i.value='');
      clearStates(0);
      inputs[0].focus();
      msg.textContent = '';
    }

    function announce(text, kind){
      msg.textContent = text || '';
      msg.classList.toggle('success', kind === 'success');
      msg.classList.toggle('error', kind === 'error');
    }

    // Apply Wordle coloring with duplicate handling
    function evaluate(){
      clearStates(0);
      const guess = inputs.map(i => i.value.toUpperCase());
      const target = ANSWER.toUpperCase().split('');

      // Count remaining letters after greens
      const counts = new Map();
      for(const ch of target){ counts.set(ch, (counts.get(ch)||0) + 1); }

      const cells = Array.from(row.children);
      const states = Array(LEN).fill('');

      // First pass: greens
      for(let i=0;i<LEN;i++){
        if(guess[i] === target[i]){
          states[i] = 'green';
          counts.set(guess[i], counts.get(guess[i]) - 1);
        }
      }

      // Second pass: yellow/red
      for(let i=0;i<LEN;i++){
        if(states[i]) continue; // already green
        const ch = guess[i];
        if(counts.get(ch) > 0){
          states[i] = 'yellow';
          counts.set(ch, counts.get(ch) - 1);
        } else {
          states[i] = 'red';
        }
      }

      // Paint
      for(let i=0;i<LEN;i++){
        cells[i].classList.add(`state-${states[i]}`);
        // small pop animation
        cells[i].style.transform = 'scale(1.04)';
        setTimeout(() => cells[i].style.transform = 'scale(1)', 90);
      }

      // Check success
      if(states.every(s => s === 'green')){
        announce(SUCCESS_TEXT, 'success');
      } else {
        announce('');
      }
    }
  </script>
</body>
</html>
