<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root{
      --box: #e5e7eb;
      --text: #111827;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --focus: #3b82f6;
      --bg: #f8fafc;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .container{
      max-width: 680px;
      margin: 6rem auto;
      padding: 1rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .row{
      display: grid;
      grid-template-columns: repeat(9, 56px);
      gap: .5rem;
      justify-content: center;
      justify-items: center;
      margin: 1rem auto 0 auto;
      width: auto;
    }
    .cell{
      width: 56px; height: 56px;
      display: grid; place-items: center;
      border: 2px solid var(--box);
      border-radius: .5rem;
      font-weight: 800; font-size: 1.5rem;
      background: white;
      transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      user-select: none;
    }
    .cell input{
      width: 100%; height: 100%;
      text-transform: uppercase;
      text-align: center;
      font: inherit; font-weight: 800; letter-spacing: .02em;
      border: none; outline: none; background: transparent; color: var(--text);
    }
    .cell:has(input:focus){ border-color: var(--focus); }
    .state-green{ background: var(--green); color: white; border-color: var(--green); }
    .state-yellow{ background: var(--yellow); color: #1f2937; border-color: var(--yellow); }
    .state-red{ background: var(--red); color: white; border-color: var(--red); }
  </style>
</head>
<body>
  <div class="container">
    <div class="row" id="row"></div>
  </div>

  <script>
    const ANSWER = "REMORA";
    const LEN = 6;
    const ALLOWED = /^[A-Z0-9]$/;

    const row = document.getElementById('row');

    const inputs = Array.from({ length: LEN }, (_, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const input = document.createElement('input');
      input.maxLength = 1;
      input.addEventListener('input', onType);
      input.addEventListener('keydown', onKey);
      cell.appendChild(input);
      row.appendChild(cell);
      return input;
    });

    inputs[0].focus();

    function onType(e){
      const input = e.target;
      const v = (input.value || '').toUpperCase();
      if(!v){
        if(!isFilled()){ clearStates(); }
        return;
      }
      const ch = v.slice(-1);
      if(!ALLOWED.test(ch)){
        input.value = '';
        if(!isFilled()){ clearStates(); }
        return;
      }
      input.value = ch;
      const idx = inputs.indexOf(input);
      if(idx < LEN-1) inputs[idx+1].focus();

      if(isFilled()) {
        evaluate();
      } else {
        clearStates();
      }
    }

    function onKey(e){
      const input = e.target;
      const idx = inputs.indexOf(input);
      if(e.key === 'Backspace'){
        if(input.value){ input.value = ''; }
        else if(idx > 0){ inputs[idx-1].focus(); inputs[idx-1].value = ''; }
        if(!isFilled()){ clearStates(); }
      } else if(e.key === 'Enter'){
        if(isFilled()) evaluate();
      } else if(e.key === 'ArrowLeft' && idx > 0){
        inputs[idx-1].focus();
      } else if(e.key === 'ArrowRight' && idx < LEN-1){
        inputs[idx+1].focus();
      }
    }

    function isFilled(){
      return inputs.every(i => i.value && ALLOWED.test(i.value.toUpperCase()));
    }

    function clearStates(){
      Array.from(row.children).forEach(c => c.className = 'cell');
    }

    function evaluate(){
      clearStates();
      const guess = inputs.map(i => i.value.toUpperCase());
      const target = ANSWER.toUpperCase().split('');
      const counts = new Map();
      for(const ch of target){ counts.set(ch, (counts.get(ch)||0)+1); }

      const cells = Array.from(row.children);
      const states = Array(LEN).fill('');

      // Greens
      for(let i=0;i<LEN;i++){
        if(guess[i]===target[i]){
          states[i]='green';
          counts.set(guess[i], counts.get(guess[i])-1);
        }
      }
      // Yellows / Reds
      for(let i=0;i<LEN;i++){
        if(states[i]) continue;
        const ch = guess[i];
        if(counts.get(ch)>0){
          states[i]='yellow';
          counts.set(ch, counts.get(ch)-1);
        } else {
          states[i]='red';
        }
      }

      for(let i=0;i<LEN;i++) cells[i].classList.add(`state-${states[i]}`);
    }
  </script>
</body>
</html>
