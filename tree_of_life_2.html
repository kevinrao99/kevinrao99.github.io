<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tree of Life 2</title>
  <meta name="author" content="Kevin Rao">
  <link rel="stylesheet" type="text/css" href="stylesheet.css">
  <link rel="icon" type="image/png" href="images/tsuki_fish.png">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css">
  <style>
    main h2 { margin-top: 2rem; font-size: 1.25rem; }
    main h3 {
      margin-top: 2rem;
      font-size: 1rem;
      overflow-wrap: anywhere;
    }
    pre {
      padding: 1rem;
      overflow-x: auto;
      border: 1px solid #ddd;
      background: #f6f8fa;
      font-size: 0.875rem;
    }
    code { font-family: ui-monospace, monospace; }
    .yaml-files { margin-top: 2rem; }
    .yaml-files > summary {
      padding: 0.5rem 0;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
    }
    .status { color: #555; }
    .tree-frame {
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #f6f8fa;
      overflow: hidden;
    }
    .tree-tabs {
      display: flex;
      gap: 0.3rem;
      padding: 0.5rem 0.5rem 0;
      overflow-x: auto;
      border-bottom: 1px solid #cbd3dc;
      background: #e9edf1;
    }
    .tree-tab-item {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      border: 1px solid transparent;
      border-bottom: 0;
      border-radius: 5px 5px 0 0;
      color: #555;
    }
    .tree-tab-item.is-active {
      border-color: #cbd3dc;
      background: #f6f8fa;
      color: #245c98;
      box-shadow: inset 0 3px #245c98;
    }
    .tree-tab, .tree-tab-close {
      min-height: 2.5rem;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .tree-tab { padding: 0.5rem 0.6rem 0.5rem 0.8rem; white-space: nowrap; }
    .tree-tab[aria-selected="true"] { font-weight: bold; }
    .tree-tab-close { min-width: 2.25rem; padding: 0.25rem; font-size: 1.25rem; }
    .tree-tab:hover, .tree-tab-close:hover { background: rgb(36 92 152 / 8%); }
    .tree-tabs :focus-visible { outline-offset: -4px; }
    .tree-panel {
      min-height: 18rem;
      max-height: 65vh;
      padding: 1rem;
      overflow: auto;
      overscroll-behavior: contain;
    }
    #tree-status, .tree-empty { margin: 0; padding: 1rem; }
    .tree-reopen {
      padding: 0.5rem 0.75rem;
      border: 1px solid #c1cad4;
      border-radius: 4px;
      background: #fff;
      color: #245c98;
      font: inherit;
      cursor: pointer;
    }
    .tree-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .tree-node { min-width: 17rem; }
    .node-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0;
      font-family: ui-monospace, monospace;
      font-size: 0.875rem;
    }
    .node-name { margin-right: 0.4rem; }
    .node-name:empty { min-width: 1rem; }
    .node-description {
      max-width: 70ch;
      margin: 0 0 0.5rem;
      color: #555;
      font-size: 0.875rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .node-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.125rem;
      height: 2.125rem;
      padding: 0;
      flex: 0 0 auto;
      border: 1px solid #c1cad4;
      border-radius: 5px;
      background: linear-gradient(#fff, #edf0f3);
      box-shadow: 0 2px 0 #bcc5ce, 0 3px 4px rgb(0 0 0 / 7%);
      color: #77818d;
      cursor: pointer;
    }
    .toggle-icon { width: 1.25rem; height: 1.25rem; }
    .node-file-open { position: relative; }
    .file-open-arrow {
      position: absolute;
      top: -0.15rem;
      right: 0.05rem;
      color: #245c98;
      font-size: 0.75rem;
      line-height: 1;
    }
    .node-toggle:hover:enabled { border-color: #7895b5; }
    .node-toggle[aria-pressed="true"] {
      transform: translateY(2px);
      border-color: #87afd5;
      background: #e4effa;
      box-shadow: inset 0 2px 3px rgb(38 83 125 / 22%);
      color: #1772d0;
    }
    .node-toggle[aria-pressed="true"] .toggle-icon {
      filter: drop-shadow(0 0 3px rgb(23 114 208 / 30%));
    }
    .node-toggle:active:enabled {
      transform: translateY(2px);
      box-shadow: inset 0 2px 3px rgb(38 83 125 / 22%);
    }
    .node-toggle:disabled {
      color: #adb4bc;
      background: #f1f3f5;
      box-shadow: none;
      border-color: #dce1e6;
      cursor: default;
    }
    :focus-visible { outline: 2px solid #245c98; outline-offset: 3px; }
    .tree-children {
      margin-left: 0.4rem;
      padding-left: 1.1rem;
      border-left: 1px solid #aeb8c2;
    }
    .node-notes {
      max-width: 70ch;
      margin: 0.35rem 0 0.75rem;
      padding: 0.75rem;
      border: 1px solid #ddd;
      background: #fff;
      font-size: 0.875rem;
      overflow-wrap: anywhere;
    }
    .note-text { margin: 0; white-space: pre-wrap; }
    .note-text + .note-text { margin-top: 1rem; }
    mark { background: #fff0a8; }
    mark.highlight-green { background: #d4edb5; }
    .branch-status { margin: 0; padding: 0.5rem 0; font-size: 0.875rem; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) {
      .tree-panel { padding: 0.75rem; }
      .tree-tab, .tree-tab-close { min-height: 2.75rem; }
      .tree-tab-close { min-width: 2.75rem; }
      .node-toggle { width: 2.75rem; height: 2.75rem; }
      .tree-children { padding-left: 0.8rem; }
    }
  </style>
  <script src="navigation.js" defer></script>
</head>
<body>
  <div id="sidebar">

    <img style="width:100%;max-width:100%" alt="profile photo" src="images/ithink_circle.png" class="hoverZoomLink">

    <h2>Resources</h2>
    <nav class="navlist" data-site-navigation aria-label="Resources"></nav>
    <p>"I think" - Charles Darwin</p>
  </div>

  <table style="width:100%;max-width:800px;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;table-layout:fixed;"><tbody>
    <tr style="padding:0px">
      <td style="padding:0px">
        <table style="width:100%;border:0px;border-spacing:0px;border-collapse:separate;margin-right:auto;margin-left:auto;table-layout:fixed;"><tbody>
          <tr>
            <td style="padding:20px;width:100%;vertical-align:middle">
              <main>
                <h1>Tree of Life 2</h1>
                <section aria-labelledby="viewer-heading">
                  <h2 id="viewer-heading">Interactive tree</h2>
                  <p>Toggle notes and subclades with the icons. Branches continued in another file open in their own tab.</p>
                  <div class="tree-frame" role="region" aria-label="Interactive tree">
                    <div id="tree-tabs" class="tree-tabs" role="tablist" aria-label="Open clades"></div>
                    <p id="tree-status" class="status" role="status">Loading tree…</p>
                    <div id="tree-panels"></div>
                    <div id="tree-empty" class="tree-empty" hidden><p>No clades are open.</p></div>
                  </div>
                </section>
                <noscript><p>Enable JavaScript to load the tree and YAML files.</p></noscript>
                <details class="yaml-files">
                  <summary>YAML files</summary>
                  <p>The source files, displayed as plain text in their folder order.</p>
                  <div id="files"></div>
                </details>
              </main>
            </td>
          </tr>
        </tbody></table>
      </td>
    </tr>
  </tbody></table>
  <script src="tree_of_life/vendor/js-yaml-4.1.1.min.js" defer></script>
  <script src="tree_of_life/viewer.js" defer></script>
</body>
</html>
